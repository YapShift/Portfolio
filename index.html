<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>YAPSHIFT // 3D Portfolio Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

    :root {
      --accent: #f5792a;
      --glass-bg: rgba(16, 19, 24, 0.78);
      --glass-border: rgba(255, 255, 255, 0.09);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #e5e7eb;
      user-select: none;
      /* 专业摄影棚中性炭灰渐变背景：极致衬托金属与岩石剪影 */
      background: radial-gradient(circle at 50% 45%, #1c2028 0%, #0d0f13 65%, #07080a 100%);
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    .studio-glass {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    .asset-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: all 0.2s ease;
    }
    .asset-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.18);
    }
    .asset-card.active {
      background: rgba(245, 121, 42, 0.14);
      border-color: rgba(245, 121, 42, 0.75);
      box-shadow: inset 2px 0 0 var(--accent);
    }

    /* 极简工业风滑块 */
    input[type="range"].clean-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      outline: none;
    }
    input[type="range"].clean-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--accent);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    input[type="range"].clean-slider::-webkit-slider-thumb:hover {
      transform: scale(1.18);
    }
    input[type="range"].clean-slider:disabled {
      opacity: 0.28;
      cursor: not-allowed;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 4px; }
  </style>
</head>
<body class="relative">

  <!-- 100% 全屏多模型并行预加载缓存视口池 -->
  <div id="sketchfab-viewport-pool" class="fixed inset-0 w-full h-full z-0"></div>

  <!-- 极简加载提示（仅在首次并行加载尚未完成时显示） -->
  <div id="loading-overlay" class="fixed inset-0 z-10 bg-[#0d0f13]/75 backdrop-blur-sm flex flex-col items-center justify-center gap-3 transition-opacity duration-300 opacity-0 pointer-events-none">
    <div class="w-8 h-8 border-2 border-[#f5792a] border-t-transparent rounded-full animate-spin"></div>
    <div class="text-xs font-mono tracking-widest text-zinc-300">LOADING 3D ASSET...</div>
  </div>

  <!-- 左上角：极简品牌标识 + 悬浮作品切换卡片 -->
  <aside class="fixed top-5 left-5 z-20 w-64 flex flex-col gap-2.5">
    <div class="studio-glass rounded-xl px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="w-2.5 h-2.5 rounded-sm bg-[#f5792a] rotate-45"></span>
        <div>
          <div class="text-sm font-bold tracking-wider text-white leading-none">YAPSHIFT</div>
          <div class="text-[10px] font-mono text-zinc-400 mt-0.5">3D TECHNICAL ARTIST</div>
        </div>
      </div>
      <a href="https://yapshift.github.io/Portfolio/" target="_blank" class="text-[10px] font-mono text-zinc-400 hover:text-white transition" title="GitHub Portfolio">↗</a>
    </div>

    <div class="studio-glass rounded-xl p-2.5 flex flex-col gap-1.5">
      <div class="px-1.5 flex items-center justify-between text-[10px] font-mono text-zinc-400 uppercase tracking-wider">
        <span>Works</span>
        <span id="gallery-count" class="text-zinc-500">2 ASSETS</span>
      </div>
      <div id="asset-list" class="flex flex-col gap-1.5"></div>
    </div>
  </aside>

  <!-- 右上角：极简工具胶囊（打光转台 / 复位视角 / 截图 / 参数抽屉） -->
  <div class="fixed top-5 right-5 z-20 flex items-center gap-2">
    <div class="studio-glass rounded-xl px-3 py-1.5 flex items-center gap-2.5 text-[11px] font-mono">
      <button id="btn-orbit" data-action="toggle-orbit" class="flex items-center gap-1.5 text-emerald-400 hover:text-emerald-300 transition">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        <span>转台: ON</span>
      </button>
      <div class="w-[1px] h-3.5 bg-white/10"></div>
      <span class="text-zinc-400">☀️</span>
      <input id="light-slider" type="range" min="0" max="360" value="0" class="clean-slider w-16 cursor-pointer" title="环境光角度" />
      <span id="light-deg" class="text-zinc-300 w-7 text-right">0°</span>
    </div>

    <div class="studio-glass rounded-xl p-1 flex items-center gap-1 text-[11px] font-mono">
      <button data-action="recenter" class="px-2.5 py-1 rounded-lg text-zinc-300 hover:text-white hover:bg-white/10 transition" title="重置相机视角">⟳ 复位</button>
      <button data-action="screenshot" class="px-2.5 py-1 rounded-lg text-zinc-300 hover:text-white hover:bg-white/10 transition" title="导出 1080p 渲染图">📸 截图</button>
      <button id="btn-toggle-drawer" data-action="toggle-drawer" class="px-2.5 py-1 rounded-lg bg-white/10 text-white hover:bg-[#f5792a]/25 hover:text-orange-200 transition">ℹ️ 参数</button>
    </div>
  </div>

  <!-- 顶部居中微提示（爆炸缩放时轻提示，不遮挡模型） -->
  <div id="cam-toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-20 studio-glass rounded-full px-3.5 py-1 text-[11px] font-mono text-zinc-200 opacity-0 pointer-events-none transition-opacity duration-300">
    🎥 镜头已随拆解自动缩放（中心锁定）
  </div>

  <!-- 右侧可折叠信息抽屉（默认收起，点击“ℹ️ 参数”展开） -->
  <aside id="drawer-panel" class="fixed top-20 right-5 bottom-24 z-20 w-80 studio-glass rounded-2xl p-4 flex flex-col gap-4 overflow-y-auto transition-all duration-300 translate-x-[120%] opacity-0 pointer-events-none">
    <div>
      <div id="spec-category" class="text-[10px] font-mono text-[#f5792a] uppercase tracking-wider"></div>
      <h2 id="spec-title" class="text-base font-bold text-white mt-1 leading-snug"></h2>
      <p id="spec-desc" class="text-xs text-zinc-400 mt-1.5 leading-relaxed"></p>
      <div id="spec-tags" class="flex flex-wrap gap-1.5 mt-2.5"></div>
    </div>

    <!-- 真实几何遥测数据 -->
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="rounded-lg bg-white/[0.04] border border-white/[0.06] py-2 px-1">
        <div class="text-[10px] text-zinc-500">三角面</div>
        <div id="spec-polys" class="text-xs font-mono font-semibold text-white mt-0.5">--</div>
      </div>
      <div class="rounded-lg bg-white/[0.04] border border-white/[0.06] py-2 px-1">
        <div class="text-[10px] text-zinc-500">顶点数</div>
        <div id="spec-verts" class="text-xs font-mono font-semibold text-white mt-0.5">--</div>
      </div>
      <div class="rounded-lg bg-white/[0.04] border border-white/[0.06] py-2 px-1">
        <div class="text-[10px] text-zinc-500">子部件</div>
        <div id="spec-parts" class="text-xs font-mono font-semibold text-emerald-400 mt-0.5">--</div>
      </div>
    </div>

    <!-- 子部件独立检视（弹出/隐藏单个零件） -->
    <div class="flex-1 flex flex-col min-h-0">
      <div class="flex items-center justify-between text-[10px] font-mono text-zinc-400 uppercase mb-2">
        <span>Sub-Parts Inspector</span>
        <span id="spec-strategy" class="text-zinc-500"></span>
      </div>
      <div id="subpart-list" class="flex-1 overflow-y-auto space-y-1.5 pr-1 text-[11px] font-mono"></div>
    </div>

    <!-- 精简个人技术栈标签（去除了主观95%进度条） -->
    <div class="pt-3 border-t border-white/10">
      <div class="text-[10px] font-mono text-zinc-500 uppercase mb-2">Pipeline & Tools</div>
      <div class="flex flex-wrap gap-1.5 text-[10px] font-mono text-zinc-300">
        <span class="px-2 py-0.5 rounded bg-white/5 border border-white/10">Blender</span>
        <span class="px-2 py-0.5 rounded bg-white/5 border border-white/10">Hard-Surface</span>
        <span class="px-2 py-0.5 rounded bg-white/5 border border-white/10">5-Level LOD</span>
        <span class="px-2 py-0.5 rounded bg-white/5 border border-white/10">PBR Baking</span>
        <span class="px-2 py-0.5 rounded bg-white/5 border border-white/10">WebGL API</span>
      </div>
    </div>
  </aside>

  <!-- 底部居中：极简悬浮控制胶囊 Dock -->
  <footer class="fixed bottom-5 left-1/2 -translate-x-1/2 z-20 studio-glass rounded-2xl px-4 py-2.5 flex items-center gap-4 max-w-[95vw] overflow-x-auto">
    <!-- 材质/检视模式 -->
    <div id="shader-toolbar" class="flex items-center gap-1 text-xs font-medium shrink-0"></div>

    <div class="w-[1px] h-5 bg-white/10 shrink-0"></div>

    <!-- 爆炸拆解控制区 -->
    <div id="dock-explode-group" class="flex items-center gap-2.5 shrink-0">
      <div class="flex items-center bg-black/40 p-0.5 rounded-lg border border-white/10 text-[11px] font-mono">
        <button id="btn-mode-cardinal" data-action="explode-mode" data-mode="cardinal" class="px-2.5 py-1 rounded-md bg-[#f5792a]/25 text-orange-200 font-semibold transition">立体拆解</button>
        <button id="btn-mode-linear" data-action="explode-mode" data-mode="linear" class="px-2.5 py-1 rounded-md text-zinc-400 hover:text-white transition">线性排布</button>
      </div>

      <input id="explode-slider" type="range" min="0" max="100" value="0" class="clean-slider w-36 cursor-pointer" />
      <span id="explode-percent" class="text-xs font-mono font-semibold text-[#f5792a] w-9 text-right">0%</span>

      <div class="flex items-center gap-1 text-[10px] font-mono">
        <button data-action="explode-to" data-val="0" class="px-2 py-1 rounded-md bg-white/5 hover:bg-white/15 text-zinc-300 transition">0%</button>
        <button data-action="explode-to" data-val="65" class="px-2 py-1 rounded-md bg-[#f5792a]/20 hover:bg-[#f5792a]/35 text-orange-200 transition">65%</button>
      </div>
    </div>
  </footer>

  <!-- 自动时间戳防缓存按序加载器 -->
  <script>
    (function loadFreshScripts() {
      const bust = Date.now();
      const files = ['./scene-math.js', './app-engine.js'];
      const loadNext = (idx) => {
        if (idx >= files.length) return;
        const s = document.createElement('script');
        s.src = files[idx] + '?t=' + bust;
        s.onload = () => loadNext(idx + 1);
        document.body.appendChild(s);
      };
      loadNext(0);
    })();
  </script>
</body>
</html>
